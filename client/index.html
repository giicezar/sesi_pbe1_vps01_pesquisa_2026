<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
</head>
</html>
<body>
    <header><h1>Formulário de Cadastro</h1></header>
    <main>
        <section>
            <form action="http://localhost:3000/dados" method="post">
                <input type="text" name="sistema" placeholder="Sistema" required><br>
                <input type="text" name="tipo" placeholder="Tipo" required><br>
                <input type="text" name="finalidade" placeholder="Finalidade" required><br>
                <input type="text" name="tecnologia" placeholder="Tecnologia" required><br>

                <label>Nível de Risco</label>
                <select name="nivelrisco" required>
                    <option value="Baixo">Baixo</option>
                    <option value="Médio">Médio</option>
                    <option value="Alto">Alto</option>
                </select><br><br>

                <label>Possui revisão humana?</label>
                <input type="checkbox" name="possui_revisao_humana" value="true"><br><br>

                <button type="submit">Enviar</button>
            </form>
        </section>
    </main>
</body>
</html>
